[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "almox"
version = "0.1.0"
description = "Controle de Materiais e Cautela: análise de dados de uma unidade logística fictícia"
requires-python = ">=3.14"
# As dependências ficam fixadas em requirements.txt / requirements-dev.txt,
# para o ambiente ser reproduzível. Este arquivo só torna o pacote instalável
# (pip install -e .) e concentra a configuração das ferramentas.

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W", # estilo (pycodestyle)
    "F",      # erros prováveis (pyflakes)
    "I",      # ordem dos imports
    "B",      # bugs comuns (bugbear)
    "UP",     # sintaxe moderna do Python
    "SIM",    # simplificações
    "S",      # segurança (bandit)
    "RUF",    # regras do próprio ruff
]

[tool.ruff.lint.per-file-ignores]
# assert é o jeito normal de testar no pytest; senhas de teste são fictícias.
"tests/**" = ["S101", "S105", "S106"]
# Catálogo: tabelas de parâmetros, mais legíveis uma por linha.
"src/almox/gerador/catalogo.py" = ["E501"]
"src/almox/complemento.py" = ["E501"]  # tabela de materiais, uma linha por tipo

[tool.ruff.lint.isort]
known-first-party = ["almox"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "db/migracoes"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integracao: precisa do Docker e do banco almoxarifado rodando",
    "lento: leva mais de 10 s (carga completa); pule com -m 'not lento' no dia a dia",
]
